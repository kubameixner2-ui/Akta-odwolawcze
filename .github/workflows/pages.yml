name: Publish browser parser
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the static parser
        run: bash scripts/build-pages.sh "$RUNNER_TEMP/site"
      - name: Verify uploads, OCR and JSON download in Chromium
        run: |
          python -m venv "$RUNNER_TEMP/pages-test"
          "$RUNNER_TEMP/pages-test/bin/pip" install playwright==1.56.0 PyMuPDF==1.26.6
          "$RUNNER_TEMP/pages-test/bin/python" -m playwright install --with-deps --only-shell chromium
          "$RUNNER_TEMP/pages-test/bin/python" scripts/check-pages.py "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
